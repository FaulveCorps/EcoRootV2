<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRoot - Glossary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>Glossary</h1>
            <input type="text" placeholder="Search terms..." class="btn" style="text-align:left; background:white; border:1px solid #ddd; margin-bottom: 20px; color: black;">
            
            <div class="card">
                <p><b>Bioremediation</b></p>
                <p class="text-muted">Using plants or microbes to clean up polluted soil.</p>
                <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
                
                <p><b>Contaminant</b></p>
                <p class="text-muted">A polluting substance that makes soil unsafe.</p>
                <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">

                <p><b>Erosion</b></p>
                <p class="text-muted">The wearing away of topsoil by wind or water.</p>
                <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">

                <p><b>Organic Matter</b></p>
                <p class="text-muted">Decayed plants and animals that provide nutrients to soil.</p>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        renderNav('glossary');
    </script>
</body>
</html>
